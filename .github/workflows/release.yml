name: Release

# Push a tag like v1.4.1 (matching roliposter/__init__.py) to build and publish a release.
# Nothing is published unless the Windows build, the signed APK build and the APK's emulator check
# all succeed, so a release always has every download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # dry run: builds and checks everything, publishes nothing

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import roliposter; print(roliposter.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != app version v$version" }

      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: cmd
        run: build_exe.bat

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/RolimonsAdPosterSetup.exe
            dist/RoliAdPoster.exe
            dist/RoliAdPosterCLI.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev zip unzip lld
      - run: pip install buildozer==1.6.0 cython setuptools
      - name: Bundle the shared engine into the app
        run: cp -r roliposter assets config.example.json android/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-release-${{ hashFiles('android/buildozer.spec') }}
      - name: Signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        working-directory: android
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          yes | buildozer android release
          mkdir -p ../apk
          cp bin/*-release.apk ../apk/RolimonsAdPoster.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/RolimonsAdPoster.apk

  android-verify:
    # Installs the exact APK being released on an emulator and checks it starts and stays up.
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/android-release-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk-check
          path: shots/

  publish:
    needs: [windows, android-verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Rolimons Ad Poster ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/RolimonsAdPosterSetup.exe
            out/RolimonsAdPoster.apk
            out/RoliAdPoster.exe
            out/RoliAdPosterCLI.exe
