name: Android

# Builds a debug APK and smoke-tests it on an emulator (screenshots + logs are uploaded as artifacts).
on:
  push:
    branches: [main, android]
    paths: ["android/**", "roliposter/**", "assets/**", ".github/workflows/android.yml", ".github/android-smoke.sh"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev zip unzip lld
      - run: pip install buildozer==1.6.0 cython setuptools
      - name: Bundle the shared engine into the app
        run: cp -r roliposter assets config.example.json android/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-debug-x86_64-${{ hashFiles('android/buildozer.spec') }}
      - name: Build debug APK (x86_64, for the emulator)
        working-directory: android
        env:
          APP_ANDROID_ARCHS: x86_64
        run: yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/bin/*.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: shots/
